name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tomllib (Linear credential parse) is stdlib on 3.11+, so 3.11 is the floor.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: pip install -e '.[test]' pyyaml
      - name: Unit suite
        run: python -m pytest -q
      - name: Smoke
        run: bash tests/smoke.sh

  secret-scan:
    name: gitleaks (block on secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history — gitleaks scans commits, not just the tree)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        # `gitleaks/gitleaks-action` now hard-requires a paid GITLEAKS_LICENSE secret for any
        # "organization" repo (github.com/gitleaks/gitleaks-action's 2026 breaking change) and,
        # on THIS self-hosted Forgejo runner, its org/user-type detection call targets the real
        # github.com API for an owner ("ultrabricks") that only exists on Forgejo — it always
        # resolves to "unexpected type [undefined]" and enforces the license wall unconditionally,
        # independent of whether a license secret is even configured. The underlying `gitleaks`
        # CLI itself is free/open-source (MIT) with no license requirement; only the wrapper
        # Action's telemetry/license layer is gated. Run the pinned CLI binary directly instead,
        # checksum-verified, to get the identical scan without that wrapper.
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --no-banner --redact
