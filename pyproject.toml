[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-cli"
version = "0.20.0"
description = "task — the enforced ticket interface: every request becomes a well-formed ticket (GitHub Issues / Linear), with quality enforced by the tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
# pyyaml is the only hard runtime dep (task.yaml parse). It is imported lazily so
# `task --help` runs even if it is missing; the tool degrades to built-in defaults.
# tomllib (Linear credentials) is stdlib on 3.11+. The HTTP backends use stdlib urllib.
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest"]
# task-cli#206: the LayaClassifier backend (tasklib/classifiers.py) — a real, local, free
# classifier, lazily imported and never a hard dependency (`task --help` never needs it).
# Upper-bounded: this module hand-parses `Agent.predict()`'s raw dict envelope, which isn't
# a versioned/stable public contract yet. task-cli#208: `laya` is now the zero-config default
# classify provider and is auto-installed on demand (tasklib/laya_autoinstall.py) or via
# install.sh's best-effort step if missing -- this extra remains the manual/pinned-version
# alternative (`uv sync --extra laya` / `pip install task-cli[laya]`).
laya = ["laya>=0.3.7,<0.4"]

[project.scripts]
task = "tasklib.cli:main"

[project.urls]
Homepage = "https://git.hyperide.ai/ultrabricks/task-cli"

# Explicit package list (NOT setuptools flat-layout autodiscovery, which would silently
# pull stray top-level dirs into the wheel). backends/ is a SUBpackage of tasklib.
[tool.setuptools.packages.find]
include = ["tasklib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
