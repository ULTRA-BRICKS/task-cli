[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-cli"
version = "0.17.0"
description = "task — the enforced ticket interface: every request becomes a well-formed ticket (GitHub Issues / Linear), with quality enforced by the tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
# pyyaml is a hard runtime dep (task.yaml parse); shtab powers the hidden
# `--print-completion {bash,zsh,tcsh}` flag rig-cli's zsh-completion mechanism execs
# (docs/specs/rig-zsh-completion.md in rig-cli). Both are imported lazily inside
# build_parser()/_load_yaml() so `task --help` runs even if either is missing; the tool
# degrades to built-in defaults / a completion-less parser rather than failing.
# tomllib (Linear credentials) is stdlib on 3.11+. The HTTP backends use stdlib urllib.
dependencies = ["pyyaml", "shtab>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
task = "tasklib.cli:main"

[project.urls]
Homepage = "https://github.com/alex-mextner/task-cli"

# Explicit package list (NOT setuptools flat-layout autodiscovery, which would silently
# pull stray top-level dirs into the wheel). backends/ is a SUBpackage of tasklib.
[tool.setuptools.packages.find]
include = ["tasklib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
